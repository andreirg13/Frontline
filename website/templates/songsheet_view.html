{% extends "base.html" %} {% block title %} {{ song.title }}{% endblock %} {%
block content %}
<link
  rel="stylesheet"
  href="{{ url_for('static', filename='songsheet.css') }}"
/>

<div class="player-container">
  <div class="player-header">
    <div class="song-info">
      <h1>{{ song.title }}</h1>
      <p class="artist">{{ song.artist }}</p>
    </div>

    <div class="controls">
      <div class="key-display">
        Current Key: <span id="currentKey">{{ song.og_key }}</span>
      </div>

      <label style="display: flex; align-items: center; gap: 6px; color: black">
        <input type="checkbox" id="toggleCompact" unchecked />
        Compact preview
      </label>
      <label style="display: flex; align-items: center; gap: 6px; color: black">
        <input type="checkbox" id="lyricsOnlyToggle" /> Lyrics Only
      </label>

      <div class="transpose-controls">
        <label> Transpose: </label>
        <select id="transposeSelect">
          <option value="-6">-6</option>
          <option value="-5">-5</option>
          <option value="-4">-4</option>
          <option value="-3">-3</option>
          <option value="-2">-2</option>
          <option value="-1">-1</option>
          <option value="0" selected>Original</option>
          <option value="1">+1</option>
          <option value="2">+2</option>
          <option value="3">+3</option>
          <option value="4">+4</option>
          <option value="5">+5</option>
          <option value="6">+6</option>
        </select>
      </div>

      <a href="{{ url_for('views.home') }}" class="btn-back">← Back to Songs</a>
      <a
        href="{{ url_for('views.songsheet_maker', id=song.id) }}"
        class="btn-back"
        >Edit Chord Sheet</a
      >
    </div>
  </div>

  <div id="chordSheetDisplay" class="chord-display"></div>
</div>

<script>
  const SONG_DATA = {
    id: {{ song.id }},
    title: {{ song.title|tojson|safe }},
    artist: {{ song.artist|tojson|safe }},
    originalKey: {{ song.og_key|tojson|safe }},
    sheetData: {{ (song.sheet_data or '')|tojson|safe }}
  };
</script>

<script
  defer
  src="{{ url_for('static', filename='vendor/bundle.min.js') }}"
></script>
<script
  defer
  src="{{ url_for('static', filename='chord_sheet_player.js') }}"
></script>

<style>
  @media print {
    * {
      margin: 0 !important;
      padding: 0 !important;
    }
    .player-container {
      margin: 0 !important;
      padding: 0 !important;
    }
    .player-header {
      margin: 0 !important;
      padding: 0 !important;
    }
  }
</style>

{% endblock %}
