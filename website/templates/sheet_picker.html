{% extends "base.html" %}
{% block title %}Pick a Song{% endblock %}

{% block content %}
<div class="picker-container">
  <h1 class="picker-title">Song Sheet Maker</h1>

  

  <div class="search-wrapper">
    <i class="bi bi-search search-icon"></i>
    <input type="text" id="searchInput" placeholder="Search for songs..." autocomplete="off" />
  </div>

  <div id="songPickerList" class="picker-list">
    {% for song in songs %}
      <div
        class="picker-item"
        data-url="{{ url_for('views.songsheet_maker', id=song.id) }}"
      >
        <span class="picker-item-text">
          <strong>{{ song.title }}</strong> — <em>{{ song.artist }}</em>
        </span>
      </div>
    {% endfor %}
  </div>


  
</div>

<link rel="stylesheet" href="{{ url_for('static', filename='sheet_picker.css') }}">

<script src="{{ url_for('static', filename='sheetPicker.js') }}"></script>
{% endblock %}
